<main class="container tool-page">
  <h1>اوقات شرعی</h1>
  <p class="tool-desc">اوقات شرعی شهرهای مهم ایران (به وقت محلی)</p>
  <div class="tool-box">
    <div class="field"><label>شهر</label>
      <select id="city" onchange="getTimes()">
        <option value="Tehran">تهران</option>
        <option value="Mashhad">مشهد</option>
        <option value="Isfahan">اصفهان</option>
        <option value="Shiraz">شیراز</option>
        <option value="Tabriz">تبریز</option>
      </select>
    </div>
    <div id="result" style="text-align:center;padding:20px;">در حال دریافت اطلاعات...</div>
  </div>
</main>
<footer class="site-footer"><div class="container">© ابزارک فارسی</div></footer>
<noscript><div><img src="https://mc.yandex.ru/watch/114021652" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
<script>
async function getTimes() {
  const city = document.getElementById('city').value;
  const el = document.getElementById('result');
  el.innerHTML = 'در حال دریافت...';
  try {
    const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Iran&method=7`);
    const data = await res.json();
    if (data.code === 200) {
      const t = data.data.timings;
      el.innerHTML = `
        <div style="font-size:1.2rem;font-weight:bold;margin-bottom:15px;color:var(--accent)">${city}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:rtl">
          <div style="background:#f1f5f9;padding:10px;border-radius:8px">صبح: <strong>${t.Fajr}</strong></div>
          <div style="background:#f1f5f9;padding:10px;border-radius:8px">ظهر: <strong>${t.Dhuhr}</strong></div>
          <div style="background:#f1f5f9;padding:10px;border-radius:8px">عصر: <strong>${t.Asr}</strong></div>
          <div style="background:#f1f5f9;padding:10px;border-radius:8px">مغرب: <strong>${t.Maghrib}</strong></div>
          <div style="background:#f1f5f9;padding:10px;border-radius:8px;grid-column:span 2">عشا: <strong>${t.Isha}</strong></div>
        </div>
      `;
    }
  } catch (e) {
    el.innerHTML = '<p style="color:red">خطا در دریافت اطلاعات. اتصال اینترنت را بررسی کنید.</p>';
  }
}
getTimes();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
