<script>
function jalaliToGregorian(){
  const jy=+document.getElementById('jy').value, jm=+document.getElementById('jm').value, jd=+document.getElementById('jd').value;
  const r=j2g(jy,jm,jd); const el=document.getElementById('result1');
  el.style.display='block'; el.textContent=jy+'/'+jm+'/'+jd+' شمسی = '+r[0]+'/'+r[1]+'/'+r[2]+' میلادی';
}
function gregorianToJalali(){
  const gy=+document.getElementById('gy').value, gm=+document.getElementById('gm').value, gd=+document.getElementById('gd').value;
  const r=g2j(gy,gm,gd); const el=document.getElementById('result2');
  el.style.display='block'; el.textContent=gy+'/'+gm+'/'+gd+' میلادی = '+r[0]+'/'+r[1]+'/'+r[2]+' شمسی';
}
function g2j(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*Math.floor(days/12053); days%=12053;
  jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function j2g(jy,jm,jd){
  let gy=(jy<=979)?621:1600; jy-=(jy<=979)?0:979;
  let days=(365*jy)+(Math.floor(jy/33)*8)+Math.floor(((jy%33)+3)/4)+78+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  gy+=400*Math.floor(days/146097); days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++;}
  gy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365;}
  let gd=days+1;
  const sal_a=[0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=1;
  for(gm=1;gm<=12;gm++){if(gd<=sal_a[gm])break;gd-=sal_a[gm];}
  return [gy,gm,gd];
}
</script>
