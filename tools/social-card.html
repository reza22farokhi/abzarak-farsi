<script>
  const textArea = document.getElementById('card-text');
  const cardText = document.querySelector('.social-card-text');
  const captureArea = document.getElementById('capture-area');
  const downloadBtn = document.getElementById('download-btn');

  // آپدیت زنده متن
  textArea.addEventListener('input', () => {
    cardText.textContent = textArea.value || '...';
  });

  // تغییر تم
  function setTheme(el, gradient) {
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    captureArea.style.background = gradient;
  }

  // دانلود با html2canvas
  downloadBtn.addEventListener('click', () => {
    const originalText = downloadBtn.textContent;
    downloadBtn.textContent = '⏳ در حال ساخت...';
    downloadBtn.disabled = true;

    // تنظیمات برای کیفیت بالا
    html2canvas(captureArea, {
      scale: 2, 
      useCORS: true,
      backgroundColor: null
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'abzarak-card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      downloadBtn.textContent = '✅ دانلود شد!';
      setTimeout(() => {
        downloadBtn.textContent = originalText;
        downloadBtn.disabled = false;
      }, 2000);
    }).catch(err => {
      console.error(err);
      alert('خطا در ساخت عکس. لطفا دوباره تلاش کنید.');
      downloadBtn.textContent = originalText;
      downloadBtn.disabled = false;
    });
  });

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
