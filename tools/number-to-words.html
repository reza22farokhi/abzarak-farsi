<script>
const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
const dahgan = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
const dahgan10 = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
const sadgan = ['', 'صد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
const scales = ['', ' هزار', ' میلیون', ' میلیارد', ' تریلیون'];

function numToWords(n) {
  if (n === 0) return 'صفر';
  let str = n.toString();
  let words = [];
  let scaleIndex = 0;
  while (str.length > 0) {
    let chunk = parseInt(str.slice(-3)) || 0;
    str = str.slice(0, -3);
    if (chunk > 0) {
      let chunkStr = threeDigitToWords(chunk);
      words.unshift(chunkStr + scales[scaleIndex]);
    }
    scaleIndex++;
  }
  return words.join(' و ');
}

function threeDigitToWords(n) {
  let parts = [];
  let s = Math.floor(n / 100);
  let rem = n % 100;
  let d = Math.floor(rem / 10);
  let y = rem % 10;
  
  if (s > 0) parts.push(sadgan[s]);
  if (rem >= 10 && rem <= 19) {
    parts.push(dahgan10[rem - 10]);
  } else {
    if (d > 0) parts.push(dahgan[d]);
    if (y > 0) parts.push(yekan[y]);
  }
  return parts.join(' و ');
}

function convert() {
  const val = document.getElementById('num').value.replace(/,/g, '');
  const el = document.getElementById('result');
  if (!val) { el.innerHTML = '...'; return; }
  if (isNaN(val)) { el.innerHTML = '<span style="color:red">لطفاً یک عدد معتبر وارد کنید.</span>'; return; }
  if (val.length > 15) { el.innerHTML = '<span style="color:red">عدد وارد شده بسیار بزرگ است.</span>'; return; }
  
  const words = numToWords(parseInt(val));
  el.innerHTML = words;
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
