<script>
const words = "لورم ایپسوم متن ساختگی با تولید سادگی نامفهوم از صنعت چاپ و با استفاده از طراحان گرافیک است. چاپگرها و متون بلکه روزنامه و مجله در ستون و سطرآنچنان که لازم است و برای شرایط فعلی تکنولوژی مورد نیاز و کاربردهای متنوع با هدف بهبود ابزارهای کاربردی می باشد. کتابهای زیادی در شصت و سه درصد گذشته حال و آینده شناخت فراوان جامعه و متخصصان را می طلبد تا با نرم افزارها شناخت بیشتری را برای طراحان رایانه ای علی الخصوص طراحان خلاقی و فرهنگ پیشرو در زبان فارسی ایجاد کرد.".split(" ");

function generate() {
  const count = parseInt(document.getElementById('count').value) || 3;
  let result = [];
  for (let i = 0; i < count; i++) {
    let p = [];
    let len = Math.floor(Math.random() * 40) + 40; // 40 to 80 words
    for (let j = 0; j < len; j++) {
      p.push(words[Math.floor(Math.random() * words.length)]);
    }
    result.push(p.join(" ") + ".");
  }
  document.getElementById('result').value = result.join("\n\n");
}
generate();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
