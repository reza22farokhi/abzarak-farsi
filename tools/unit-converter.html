<main class="container tool-page">
  <h1>مبدل واحد</h1>
  <p class="tool-desc">واحد موردنظر را انتخاب کنید و مقدار را وارد کنید.</p>
  <div class="tool-box">
    <div class="field"><label>دسته</label>
      <select id="cat" onchange="updateUnits()">
        <option value="length">طول</option>
        <option value="weight">وزن</option>
        <option value="temperature">دما</option>
      </select>
    </div>
    <div class="unit-grid">
      <div class="field"><label>مقدار</label><input type="number" id="val" value="1" step="any"></div>
      <div class="field"><label>از</label><select id="from"></select></div>
      <div class="field"><label>به</label><select id="to"></select></div>
    </div>
    <button class="btn" onclick="convert()">تبدیل</button>
    <div id="result"></div>
  </div>
</main>
<footer class="site-footer"><div class="container">© ابزارک فارسی</div></footer>
<script>
const units = {
  length: { m: 'متر', cm: 'سانتی‌متر', km: 'کیلومتر', inch: 'اینچ', foot: 'فوت', mile: 'مایل', yard: 'یارد' },
  weight: { kg: 'کیلوگرم', g: 'گرم', mg: 'میلی‌گرم', pound: 'پوند', ounce: 'اونس', ton: 'تن' },
  temperature: { C: 'سلسیوس (°C)', F: 'فارنهایت (°F)', K: 'کلوین (K)' }
};
const factors = {
  length: { m: 1, cm: 0.01, km: 1000, inch: 0.0254, foot: 0.3048, mile: 1609.344, yard: 0.9144 },
  weight: { kg: 1, g: 0.001, mg: 0.000001, pound: 0.45359237, ounce: 0.0283495231, ton: 1000 }
};
function updateUnits() {
  const cat = document.getElementById('cat').value;
  const from = document.getElementById('from');
  const to = document.getElementById('to');
  from.innerHTML = ''; to.innerHTML = '';
  Object.keys(units[cat]).forEach(k => {
    from.innerHTML += '<option value="' + k + '">' + units[cat][k] + '</option>';
    to.innerHTML += '<option value="' + k + '">' + units[cat][k] + '</option>';
  });
  if (cat === 'length' || cat === 'weight') {
    to.selectedIndex = 1;
  } else {
    to.selectedIndex = 1;
  }
  document.getElementById('result').innerHTML = '';
}
function convert() {
  const cat = document.getElementById('cat').value;
  const v = parseFloat(document.getElementById('val').value);
  const from = document.getElementById('from').value;
  const to = document.getElementById('to').value;
  const el = document.getElementById('result');
  if (isNaN(v)) { el.innerHTML = '<div class="unit-result" style="color:#991b1b">مقدار معتبر وارد کنید</div>'; return; }
  let res;
  if (cat === 'temperature') {
    let c;
    if (from === 'C') c = v;
    else if (from === 'F') c = (v - 32) * 5 / 9;
    else c = v - 273.15;
    if (to === 'C') res = c;
    else if (to === 'F') res = c * 9 / 5 + 32;
    else res = c + 273.15;
  } else {
    res = v * factors[cat][from] / factors[cat][to];
  }
  const formatted = Math.abs(res) < 0.01 ? res.toExponential(4) : res.toFixed(4).replace(/\.?0+$/, '');
  el.innerHTML = '<div class="unit-result">' + v + ' ' + units[cat][from] + ' = <strong>' + formatted + '</strong> ' + units[cat][to] + '</div>';
}
updateUnits();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("../sw.js").catch(() => {}); });
}
</script>
