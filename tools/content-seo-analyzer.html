<script>
function analyze() {
  const text = document.getElementById('text').value;
  const keyword = document.getElementById('keyword').value.trim();
  const checklist = document.getElementById('checklist');
  const scoreEl = document.getElementById('score-circle');
  const scoreVal = document.getElementById('score-value');
  const scoreLbl = document.getElementById('score-label');
  
  if (!text.trim()) {
    scoreVal.textContent = '0';
    scoreLbl.textContent = 'در انتظار متن...';
    scoreEl.style.background = 'conic-gradient(#e2e8f0 0deg, #e2e8f0 360deg)';
    document.getElementById('word-count').textContent = '0';
    document.getElementById('density').textContent = '0%';
    checklist.innerHTML = '<li><span class="icon">⏳</span><span>برای شروع، متن خود را وارد کنید.</span></li>';
    return;
  }

  // ۱. محاسبات پایه
  const words = text.trim().split(/\s+/).filter(w => w.length > 0);
  const wordCount = words.length;
  document.getElementById('word-count').textContent = wordCount;

  let score = 0;
  let checks = [];

  // ۲. بررسی طول متن
  if (wordCount >= 300) {
    score += 20;
    checks.push('<span class="icon success-text">✅</span><span>طول متن عالی است (بیشتر از ۳۰۰ کلمه).</span>');
  } else if (wordCount >= 100) {
    score += 10;
    checks.push('<span class="icon warn-text">⚠️</span><span>متن کمی کوتاه است. برای سئوی بهتر، حداقل ۳۰۰ کلمه بنویسید.</span>');
  } else {
    checks.push('<span class="icon error-text">❌</span><span>متن بسیار کوتاه است. گوگل به محتوای بلندتر رتبه بهتری می‌دهد.</span>');
  }

  // ۳. بررسی کلمه کلیدی
  if (keyword) {
    const keywordRegex = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const keywordMatches = (text.match(keywordRegex) || []).length;
    const density = ((keywordMatches * (keyword.split(' ').length)) / wordCount * 100).toFixed(1);
    
    document.getElementById('density').textContent = density + '%';

    if (density > 0 && density <= 3) {
      score += 30;
      checks.push('<span class="icon success-text">✅</span><span>چگالی کلمه کلیدی عالی است (' + density + '٪).</span>');
    } else if (density === '0.0' || keywordMatches === 0) {
      checks.push('<span class="icon error-text">❌</span><span>کلمه کلیدی در متن شما وجود ندارد!</span>');
    } else if (density > 3) {
      score += 10;
      checks.push('<span class="icon warn-text">⚠️</span><span>چگالی کلمه کلیدی بالاست (' + density + '٪). گوگل ممکن است آن را اسپم بداند (Keyword Stuffing).</span>');
    }
  } else {
    checks.push('<span class="icon warn-text">ℹ️</span><span>کلمه کلیدی وارد نشده است (اختیاری).</span>');
  }

  // ۴. بررسی حروف عربی
  const arabicMatches = text.match(/[يك]/g);
  if (arabicMatches) {
    checks.push('<span class="icon error-text">❌</span><span>مشکل املایی: ' + arabicMatches.length + ' مورد حرف عربی (ي، ك) پیدا شد. از <a href="persian-cleaner.html" style="color:var(--accent)">ابزار پاک‌سازی متن</a> استفاده کنید.</span>');
  } else {
    score += 20;
    checks.push('<span class="icon success-text">✅</span><span>هیچ حرف عربی در متن وجود ندارد.</span>');
  }

  // ۵. بررسی نیم‌فاصله
  const nimeMatches = text.match(/‌/g);
  if (nimeMatches && nimeMatches.length > 0) {
    score += 15;
    checks.push('<span class="icon success-text">✅</span><span>نیم‌فاصله‌ها رعایت شده‌اند (' + nimeMatches.length + ' مورد).</span>');
  } else {
    score += 5;
    checks.push('<span class="icon warn-text">⚠️</span><span>از نیم‌فاصله استفاده نکرده‌اید. (مثلاً می‌روم به جای می روم).</span>');
  }

  // ۶. بررسی طول جملات (خوانایی)
  const sentences = text.split(/[.?!؟]/).filter(s => s.trim().length > 0);
  if (sentences.length > 0) {
    const avgWordsPerSentence = Math.round(wordCount / sentences.length);
    if (avgWordsPerSentence <= 25) {
      score += 15;
      checks.push('<span class="icon success-text">✅</span><span>جملات شما کوتاه و خوانا هستند (میانگین ' + avgWordsPerSentence + ' کلمه).</span>');
    } else {
      checks.push('<span class="icon warn-text">⚠️</span><span>جملات شما طولانی هستند (میانگین ' + avgWordsPerSentence + ' کلمه). برای خوانایی بهتر، جملات را کوتاه‌تر کنید.</span>');
    }
  }

  // ۷. محاسبه نهایی و رنگ‌بندی
  score = Math.min(100, score);
  scoreVal.textContent = score;

  let color, label;
  if (score >= 80) { color = '#10b981'; label = 'عالی! متن شما از نظر سئو بی‌نقص است.'; }
  else if (score >= 50) { color = '#f59e0b'; label = 'متوسط. با رفع هشدارهای بالا، رتبه بهتری می‌گیرید.'; }
  else { color = '#ef4444'; label = 'ضعیف. متن شما نیاز به بازنگری جدی دارد.'; }

  scoreEl.style.background = 'conic-gradient(' + color + ' 0deg, ' + color + ' ' + (score * 3.6) + 'deg, #e2e8f0 ' + (score * 3.6) + 'deg)';
  scoreLbl.textContent = label;
  scoreLbl.style.color = color;

  // نمایش چک‌لیست
  checklist.innerHTML = checks.map(c => '<li>' + c + '</li>').join('');
}
