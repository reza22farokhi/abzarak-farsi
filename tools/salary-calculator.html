      <input type="number" id="house" value="900000" oninput="calc()"></div>
    <div class="field"><label>بن کارگری (تومان)</label>
      <input type="number" id="food" value="1100000" oninput="calc()"></div>
    <div class="field"><label>حق اولاد (تومان)</label>
      <input type="number" id="child" value="0" oninput="calc()"></div>
    
    <div id="result" style="margin-top:20px;"></div>
  </div>

<script>
function calc() {
  const base = Number(document.getElementById('base').value) || 0;
  const house = Number(document.getElementById('house').value) || 0;
  const food = Number(document.getElementById('food').value) || 0;
  const child = Number(document.getElementById('child').value) || 0;
  
  const total = base + house + food + child;
  const insurance = total * 0.07;
  // فرمول ساده شده مالیات (معافیت ۱۴۰۳)
  const taxExempt = 120000000;
  let taxable = total - insurance - (taxExempt / 12);
  if (taxable < 0) taxable = 0;
  const tax = taxable * 0.10; // نرخ تقریبی ۱۰ درصد
  
  const net = total - insurance - tax;
  
  const fmt = (n) => n.toLocaleString('fa-IR') + ' تومان';
  
  document.getElementById('result').innerHTML = `
    <div style="background:#f1f5f9;padding:15px;border-radius:8px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between"><span>جمع کل (ناخالص):</span><strong>${fmt(total)}</strong></div>
      <div style="display:flex;justify-content:space-between;color:red"><span>بیمه سهم کارمند (۷٪):</span><strong>${fmt(insurance)}</strong></div>
      <div style="display:flex;justify-content:space-between;color:red"><span>مالیات بر درآمد:</span><strong>${fmt(tax)}</strong></div>
      <hr style="border:0;border-top:1px solid #cbd5e1">
      <div style="display:flex;justify-content:space-between;font-size:1.2rem;color:green"><span>حقوق خالص (دریافتی):</span><strong>${fmt(net)}</strong></div>
    </div>
  `;
}
calc();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
