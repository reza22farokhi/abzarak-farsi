<main class="container tool-page">
  <h1>سازنده رمز عبور</h1>
  <p class="tool-desc">یک رمز عبور تصادفی و امن برای خود بسازید.</p>
  <div class="tool-box">
    <div class="field"><label>طول رمز عبور: <span id="len-label">16</span></label>
      <input type="range" id="length" min="6" max="64" value="16" style="width:100%;">
    </div>
    <div class="field">
      <label><input type="checkbox" id="upper" checked> حروف بزرگ</label><br>
      <label><input type="checkbox" id="lower" checked> حروف کوچک</label><br>
      <label><input type="checkbox" id="numbers" checked> اعداد</label><br>
      <label><input type="checkbox" id="symbols"> نمادها (!@#$%)</label>
    </div>
    <button class="btn" onclick="generate()">تولید رمز عبور</button>
    <div class="result" id="result" style="display:none;font-family:monospace;font-size:1.2rem;direction:ltr;text-align:center;"></div>
    <button class="btn" id="copy-btn" style="display:none;margin-top:12px;" onclick="copy()">📋 کپی</button>
  </div>
</main>
<footer class="site-footer"><div class="container">© ابزارک فارسی</div></footer>
<script>
const lengthEl=document.getElementById('length');
lengthEl.addEventListener('input',()=>document.getElementById('len-label').textContent=lengthEl.value);
function generate(){
  const len=+lengthEl.value; let chars='';
  if(document.getElementById('upper').checked) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('lower').checked) chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('numbers').checked) chars+='0123456789';
  if(document.getElementById('symbols').checked) chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  const rEl=document.getElementById('result'), cBtn=document.getElementById('copy-btn');
  if(!chars){rEl.style.display='block';rEl.textContent='حداقل یک گزینه را انتخاب کنید';cBtn.style.display='none';return;}
  const arr=new Uint32Array(len); crypto.getRandomValues(arr);
  let pw=''; for(let i=0;i<len;i++) pw+=chars[arr[i]%chars.length];
  rEl.style.display='block'; rEl.textContent=pw; cBtn.style.display='inline-block';
}
function copy(){
  navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>{
    const btn=document.getElementById('copy-btn'), o=btn.textContent;
    btn.textContent='✓ کپی شد'; setTimeout(()=>btn.textContent=o,1500);
  });
}
</script>
