<script>
function checkID() {
  const input = document.getElementById('nid').value.trim();
  const el = document.getElementById('result');
  el.style.display = 'block';
  
  if (input.length !== 10 || !/^\d+$/.test(input)) {
    el.innerHTML = '<span style="color:#dc2626; font-weight:bold;">❌ کد ملی باید دقیقاً ۱۰ رقم عددی باشد.</span>';
    return;
  }
  if (/^(\d)\1{9}$/.test(input)) {
    el.innerHTML = '<span style="color:#dc2626; font-weight:bold;">❌ کد ملی وارد شده معتبر نیست (اعداد تکراری).</span>';
    return;
  }
  
  let sum = 0;
  for (let i = 0; i < 9; i++) {
    sum += parseInt(input[i]) * (10 - i);
  }
  const remainder = sum % 11;
  const checkDigit = parseInt(input[9]);
  
  if ((remainder < 2 && checkDigit === remainder) || (remainder >= 2 && checkDigit === 11 - remainder)) {
    el.innerHTML = '<span style="color:#10b981; font-weight:bold; font-size:1.2rem;">✅ کد ملی وارد شده صحیح و معتبر است.</span>';
  } else {
    el.innerHTML = '<span style="color:#dc2626; font-weight:bold;">❌ کد ملی وارد شده اشتباه است.</span>';
  }
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
