<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سازنده QR Code آنلاین | ابزارک فارسی</title>
<meta name="description" content="تولید کد QR از متن، لینک یا شماره تماس به صورت رایگان و آنلاین">
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#6366f1">
<meta property="og:title" content="سازنده QR Code آنلاین | ابزارک فارسی">
<meta property="og:description" content="تولید کد QR از متن، لینک یا شماره تماس به صورت رایگان و آنلاین">
<meta property="og:type" content="website">
<meta property="og:locale" content="fa_IR">
</head>
<body>
<header class="site-header"><div class="container header-inner">
  <a href="../index.html" class="brand">ابزارک فارسی</a>
  <nav><a href="../index.html">خانه</a></nav>
</div></header>
<main class="container tool-page">
  <h1>سازنده QR Code</h1>
  <p class="tool-desc">متن یا لینک خود را وارد کنید تا کد QR ساخته شود.</p>
  <div class="tool-box">
    <div class="field"><label>متن یا لینک</label><input type="text" id="text" placeholder="مثلاً https://example.com"></div>
    <div class="field"><label>اندازه (پیکسل)</label>
      <select id="size"><option value="200">200</option><option value="300" selected>300</option><option value="400">400</option><option value="500">500</option></select>
    </div>
    <button class="btn" onclick="generate()">ساخت QR Code</button>
    <div id="qr-result"></div>
  </div>
</main>
<footer class="site-footer"><div class="container">© ابزارک فارسی</div></footer>
<script>
function generate(){
  const text=document.getElementById('text').value.trim();
  const size=document.getElementById('size').value;
  const result=document.getElementById('qr-result');
  if(!text){result.innerHTML='<p style="color:#dc2626;">لطفاً متن یا لینک را وارد کنید.</p>';return;}
  const url='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(text);
  result.innerHTML='<img src="'+url+'" alt="QR Code" style="max-width:100%;border:1px solid #e2e8f0;border-radius:8px;background:#fff;"><br><a href="'+url+'" download="qrcode.png" class="btn" style="display:inline-block;margin-top:12px;text-decoration:none;">دانلود</a>';
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("../sw.js").catch(() => {}); });
}
</script>
</body>
</html>
