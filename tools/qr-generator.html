<script>
function generate(){
  const text=document.getElementById('text').value.trim();
  const size=document.getElementById('size').value;
  const result=document.getElementById('qr-result');
  if(!text){result.innerHTML='<p style="color:#dc2626;">لطفاً متن یا لینک را وارد کنید.</p>';return;}
  const url='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(text);
  result.innerHTML='<img src="'+url+'" alt="QR Code" style="max-width:100%;border:1px solid #e2e8f0;border-radius:8px;background:#fff;"><br><a href="'+url+'" download="qrcode.png" class="btn" style="display:inline-block;margin-top:12px;text-decoration:none;">دانلود</a>';
}
</script>
