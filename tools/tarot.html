<style>
  .tarot-container { max-width: 1000px; margin: 0 auto; padding: 20px; text-align: center; font-family: 'Vazirmatn', sans-serif; }
  .tarot-start {
    background: radial-gradient(circle at center, #1e1b4b, #0f172a);
    border: 2px solid #8b5cf6; border-radius: 20px; padding: 60px 20px;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.3); margin-bottom: 30px;
  }
  .tarot-title { font-size: 2.5rem; font-weight: 800; color: #c4b5fd; margin-bottom: 10px; text-shadow: 0 0 10px rgba(196, 181, 253, 0.5); }
  .tarot-subtitle { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
  .tarot-btn-start {
    background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; font-size: 1.2rem; font-weight: bold;
    padding: 16px 50px; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s;
    box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
  }
  .tarot-btn-start:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 35px rgba(236, 72, 153, 0.6); }
  
  .cards-wrapper { display: flex; justify-content: center; gap: 20px; margin: 40px 0; flex-wrap: wrap; }
  .tarot-card {
    width: 200px; height: 340px; perspective: 1000px; cursor: pointer; display: none;
  }
  .tarot-card.show { display: block; animation: dealCard 0.6s ease forwards; }
  @keyframes dealCard { from { opacity: 0; transform: translateY(50px) rotate(-10deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
  
  .card-inner { width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; position: relative; }
  .tarot-card.flipped .card-inner { transform: rotateY(180deg); }
  
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  
  /* پشت کارت (طرح مرموز) */
  .card-back {
    background: repeating-linear-gradient(45deg, #1e1b4b, #1e1b4b 10px, #312e81 10px, #312e81 20px);
    border: 3px solid #fbbf24; color: #fbbf24; font-size: 3rem;
  }
  .card-back::after { content: '🌙'; opacity: 0.5; }
  
  /* روی کارت */
  .card-front {
    background: #0f172a; border: 2px solid #8b5cf6; transform: rotateY(180deg);
    padding: 15px; text-align: center; color: white;
  }
  .card-icon { font-size: 4rem; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
  .card-name { font-size: 1.1rem; font-weight: bold; color: #c4b5fd; margin-bottom: 10px; }
  .card-keywords { font-size: 0.85rem; color: #94a3b8; }
  
  .card-label { color: #94a3b8; font-weight: bold; margin-bottom: 10px; text-align: center; display: block; }
  
  .tarot-result { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 30px; margin-top: 30px; text-align: right; animation: fadeIn 0.8s ease; }
  .tarot-result h3 { color: var(--accent); margin-bottom: 15px; font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .result-item { margin-bottom: 20px; line-height: 1.8; }
  .result-item strong { color: #8b5cf6; display: block; margin-bottom: 5px; }
  
  .share-btn { margin-top: 20px; width: 100%; background: #10b981; color: white; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; }
  .share-btn:hover { background: #059669; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

          </div>
        </div>
      </div>

        </div>

<script>
  let drawnCards = [];
  let flippedCount = 0;

  function startTarot() {
    document.getElementById('tarot-start').style.display = 'none';
    
    // انتخاب 3 کارت تصادفی و غیرتکراری
    let shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
    drawnCards = shuffled.slice(0, 3);
    
    // پاکسازی کارت‌های قبلی
    for (let i=1; i<=3; i++) {
      document.getElementById('card-'+i).classList.remove('flipped', 'show');
    }
    document.getElementById('tarot-result').style.display = 'none';
    document.getElementById('share-btn').style.display = 'none';
    flippedCount = 0;

    // نمایش کارت‌ها با انیمیشن
    setTimeout(() => document.getElementById('card-1').classList.add('show'), 100);
    setTimeout(() => document.getElementById('card-2').classList.add('show'), 300);
    setTimeout(() => document.getElementById('card-3').classList.add('show'), 500);
  }

  function flipCard(num) {
    const cardEl = document.getElementById('card-' + num);
    if (cardEl.classList.contains('flipped')) return;

    cardEl.classList.add('flipped');
    flippedCount++;

    const cardData = drawnCards[num-1];
    const frontEl = document.getElementById('front-' + num);
    
    frontEl.innerHTML = `
      <div class="card-icon">${cardData.icon}</div>
      <div class="card-name">${cardData.name}</div>
      <div class="card-keywords">${cardData.keywords}</div>
    `;

    if (flippedCount === 3) {
      showInterpretation();
    }
  }

  function showInterpretation() {
    const resultDiv = document.getElementById('tarot-result');
    const textDiv = document.getElementById('interpretation-text');
    
    let html = '';
    
    html += `<div class="result-item"><strong>🕰️ گذشته (${drawnCards[0].name}):</strong> ${drawnCards[0].past}</div>`;
    html += `<div class="result-item"><strong>🌿 حال (${drawnCards[1].name}):</strong> ${drawnCards[1].present}</div>`;
    html += `<div class="result-item"><strong>🌟 آینده (${drawnCards[2].name}):</strong> ${drawnCards[2].future}</div>`;
    
    textDiv.innerHTML = html;
    resultDiv.style.display = 'block';
    document.getElementById('share-btn').style.display = 'block';
    
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function shareTarot() {
    const text = `🔮 فال تاروت من:\n\n🕰️ گذشته: ${drawnCards[0].name}\n🌿 حال: ${drawnCards[1].name}\n🌟 آینده: ${drawnCards[2].name}\n\nفال از: ابزارک فارسی`;
    const url = window.location.href;
    
    if (navigator.share) {
      navigator.share({ title: 'فال تاروت', text: text, url: url }).catch(console.error);
    } else {
      navigator.clipboard.writeText(text + '\n' + url).then(() => alert('متن فال کپی شد!'));
    }
  }

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
