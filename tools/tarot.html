<style>
  .tarot-container { max-width: 1000px; margin: 0 auto; padding: 20px; text-align: center; }
  .tarot-start {
    background: radial-gradient(circle at center, #1e1b4b, #0f172a);
    border: 2px solid #8b5cf6; border-radius: 20px; padding: 50px 20px;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.3); margin-bottom: 30px;
  }
  .tarot-title { font-size: 2.5rem; font-weight: 800; color: #c4b5fd; margin-bottom: 10px; text-shadow: 0 0 10px rgba(196, 181, 253, 0.5); }
  .tarot-subtitle { color: #94a3b8; font-size: 1.1rem; margin-bottom: 30px; }
  
  .spread-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; max-width: 800px; margin: 0 auto; }
  .spread-btn {
    background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border: 1px solid #8b5cf6;
    padding: 20px 15px; border-radius: 12px; cursor: pointer; transition: all 0.3s;
    font-family: inherit; font-size: 1rem; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .spread-btn:hover { background: rgba(139, 92, 246, 0.3); transform: translateY(-3px); border-color: #ec4899; color: white; box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); }
  .spread-btn .icon { font-size: 2rem; }
  .spread-btn .desc { font-size: 0.75rem; color: #94a3b8; font-weight: normal; }
  
  .cards-wrapper { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
  .card-slot { display: flex; flex-direction: column; align-items: center; }

  .tarot-card {
    width: 200px; height: 340px; perspective: 1000px; cursor: pointer; display: none;
  }
  .tarot-card.show { display: block; animation: dealCard 0.6s ease forwards; }
  @keyframes dealCard { from { opacity: 0; transform: translateY(50px) rotate(-10deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
  
  .card-inner { width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; position: relative; }
  .tarot-card.flipped .card-inner { transform: rotateY(180deg); }
  
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card-back {
    background: repeating-linear-gradient(45deg, #1e1b4b, #1e1b4b 10px, #312e81 10px, #312e81 20px);
    border: 3px solid #fbbf24; color: #fbbf24; font-size: 3rem;
  }
  .card-back::after { content: '🌙'; opacity: 0.5; }
  .card-front {
    background: #000; border: 3px solid #fbbf24; transform: rotateY(180deg);
    padding: 0;
  }
  .card-front img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 9px;
  }

  .card-label { color: #c4b5fd; font-weight: bold; margin-bottom: 10px; text-align: center; display: block; font-size: 0.9rem; }
  
  .tarot-result { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 30px; margin-top: 30px; text-align: right; animation: fadeIn 0.8s ease; }
  .tarot-result h3 { color: var(--accent); margin-bottom: 20px; font-size: 1.4rem; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
  
  .result-card-detail { background: var(--bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border-right: 4px solid #8b5cf6; }
  .result-card-detail h4 { color: #8b5cf6; margin-bottom: 10px; font-size: 1.15rem; }
  .result-card-detail .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
  .result-card-detail .interpretation { line-height: 1.9; margin-bottom: 10px; }
  .result-card-detail .advice-box { background: rgba(139, 92, 246, 0.1); padding: 12px; border-radius: 8px; font-size: 0.9rem; border-right: 3px solid #fbbf24; margin-top: 10px; }
  
  .yesno-answer { text-align: center; font-size: 2rem; font-weight: 800; padding: 30px; background: rgba(139, 92, 246, 0.1); border-radius: 12px; margin: 20px 0; color: #c4b5fd; }
  
  .share-btn { margin-top: 20px; width: 100%; background: #10b981; color: white; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; font-family: inherit; font-size: 1rem; }
  .share-btn:hover { background: #059669; }
  .new-fal-btn { margin-top: 10px; width: 100%; background: var(--bg); color: var(--text); padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-weight: bold; cursor: pointer; display: none; font-family: inherit; font-size: 1rem; }
  .new-fal-btn:hover { background: var(--border); }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
  const spreads = {
    daily: { title: "کارت روز", labels: ["پیام امروز شما"], count: 1 },
    ppp: { title: "گذشته، حال، آینده", labels: ["گذشته", "حال", "آینده"], count: 3 },
    love: { title: "فال عشق", labels: ["قلب شما", "قلب طرف مقابل"], count: 2 },
    career: { title: "فال شغل", labels: ["وضعیت فعلی", "چالش پیش‌رو", "نتیجه"], count: 3 },
    yesno: { title: "بله / خیر", labels: ["پاسخ به سوال شما"], count: 1 }
  };

  let currentSpread = null;
  let drawnCards = [];
  let flippedCount = 0;

  function startSpread(spreadKey) {
    currentSpread = spreads[spreadKey];
    document.getElementById('tarot-start').style.display = 'none';
    document.getElementById('tarot-result').style.display = 'none';
    
    // انتخاب کارت‌های تصادفی
    let shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
    drawnCards = shuffled.slice(0, currentSpread.count);
    
    // ساخت کارت‌ها
    const wrapper = document.getElementById('cards-wrapper');
    wrapper.innerHTML = '';
    flippedCount = 0;
    
    for (let i = 0; i < currentSpread.count; i++) {
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.innerHTML = `
        <span class="card-label">${currentSpread.labels[i]}</span>
        <div class="tarot-card" id="card-${i}" onclick="flipCard(${i})">
          <div class="card-inner">
            <div class="card-back"></div>
            <div class="card-front" id="front-${i}"></div>
          </div>
        </div>
      `;
      wrapper.appendChild(slot);
      
      setTimeout(() => document.getElementById('card-'+i).classList.add('show'), 100 + (i * 200));
    }
  }

  function flipCard(index) {
    const cardEl = document.getElementById('card-' + index);
    if (cardEl.classList.contains('flipped')) return;
    cardEl.classList.add('flipped');
    flippedCount++;
    
    const cardData = drawnCards[index];
    document.getElementById('front-' + index).innerHTML = `
      <img src="${cardData.img}" alt="${cardData.name}">
    `;
    
    if (flippedCount === currentSpread.count) {
      setTimeout(showInterpretation, 800);
    }
  }

  function showInterpretation() {
    const resultDiv = document.getElementById('tarot-result');
    const textDiv = document.getElementById('interpretation-text');
    
    let html = '';
    const labels = currentSpread.labels;
    
    // بررسی نوع فال
    if (labels[0] === "بله / خیر" || labels[0] === "پاسخ به سوال شما") {
      // فال بله/خیر
      const c = drawnCards[0];
      html = `
        <div class="yesno-answer">${c.yesNo}</div>
        <div class="result-card-detail">
          <h4><img src="${c.img}" style="width:40px; height:68px; border-radius:4px; vertical-align:middle; margin-left:8px; border:1px solid #cbd5e1;"> ${c.name}</h4>
          <div class="meta">عنصر: ${c.element} | کلیدواژه: ${c.keywords}</div>
          <div class="interpretation">${c.description}</div>
          <div class="interpretation"><strong>معنی کارت:</strong> ${c.upright}</div>
          <div class="advice-box"><strong>💡 توصیه:</strong> ${c.advice}</div>
        </div>
      `;
    } else if (currentSpread.labels[0] === "پیام امروز شما") {
      // کارت روز
      const c = drawnCards[0];
      html = `
        <div class="result-card-detail">
          <h4><img src="${c.img}" style="width:40px; height:68px; border-radius:4px; vertical-align:middle; margin-left:8px; border:1px solid #cbd5e1;"> ${c.name}</h4>
          <div class="meta">عنصر: ${c.element} | سیاره: ${c.astro} | کلیدواژه: ${c.keywords}</div>
          <div class="interpretation"><strong>شرح کارت:</strong> ${c.description}</div>
          <div class="interpretation"><strong>پاسخ به امروز:</strong> ${c.present}</div>
          <div class="interpretation"><strong>معنی کلی:</strong> ${c.upright}</div>
          <div class="advice-box"><strong>💡 توصیه امروز:</strong> ${c.advice}</div>
        </div>
      `;
    } else if (currentSpread.count === 2 && labels[0] === "قلب شما") {
      // فال عشق
      const c1 = drawnCards[0], c2 = drawnCards[1];
      html = `
        <div class="result-card-detail">
          <h4>❤️ قلب شما: ${c1.icon} ${c1.name}</h4>
          <div class="meta">عنصر: ${c1.element} | کلیدواژه: ${c1.keywords}</div>
          <div class="interpretation">${c1.love}</div>
          <div class="interpretation"><strong>شرح کارت:</strong> ${c1.description}</div>
          <div class="advice-box"><strong>💡 توصیه:</strong> ${c1.advice}</div>
        </div>
        <div class="result-card-detail">
          <h4>💕 قلب طرف مقابل: ${c2.icon} ${c2.name}</h4>
          <div class="meta">عنصر: ${c2.element} | کلیدواژه: ${c2.keywords}</div>
          <div class="interpretation">${c2.love}</div>
          <div class="interpretation"><strong>شرح کارت:</strong> ${c2.description}</div>
          <div class="advice-box"><strong>💡 توصیه:</strong> ${c2.advice}</div>
        </div>
      `;
    } else {
      // فال سه‌کارتی (ppp یا career) - نمایش کامل
      for (let i = 0; i < currentSpread.count; i++) {
        const c = drawnCards[i];
        let positionInterpretation = '';
        if (currentSpread.title === "گذشته، حال، آینده") {
          if (i === 0) positionInterpretation = c.past_full || c.past;
          else if (i === 1) positionInterpretation = c.present_full || c.present;
          else positionInterpretation = c.future_full || c.future;
        } else if (currentSpread.title === "فال شغل") {
          if (i === 0) positionInterpretation = c.career_full || c.career;
          else if (i === 1) positionInterpretation = c.reversed_full || c.reversed;
          else positionInterpretation = c.career_full || c.career;
        }
        
        html += `
          <div class="result-card-detail" style="margin-bottom:30px; padding:25px;">
            <h4 style="font-size:1.3rem; margin-bottom:15px; color:var(--accent);">${labels[i]}: ${c.name}</h4>
            <div class="meta" style="margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid var(--border);">عنصر: ${c.element} | کلیدواژه: ${c.keywords}</div>
            
            <div style="margin-bottom:12px;"><strong style="color:#8b5cf6;">👁️ توصیف تصویر:</strong> ${c.visual || '-'}</div>
            <div style="margin-bottom:12px;"><strong style="color:#8b5cf6;">🔍 نمادشناسی:</strong> ${c.symbolism || '-'}</div>
            <div style="margin-bottom:12px;"><strong style="color:#8b5cf6;">☀️ معنی مستقیم:</strong> ${c.upright_full || c.upright}</div>
            <div style="margin-bottom:12px;"><strong style="color:#8b5cf6;">🌑 معنی معکوس:</strong> ${c.reversed_full || c.reversed}</div>
            <div style="margin-bottom:12px; padding:12px; background:rgba(139,92,246,0.1); border-radius:8px;"><strong style="color:#8b5cf6;">🎯 تفسیر در این جایگاه:</strong> ${positionInterpretation}</div>
            <div style="margin-bottom:12px;"><strong style="color:#8b5cf6;">❤️ در عشق:</strong> ${c.love_full || c.love}</div>
            <div style="margin-bottom:12px;"><strong style="color:#8b5cf6;">💼 در شغل:</strong> ${c.career_full || c.career}</div>
            <div class="advice-box" style="background:rgba(251,191,36,0.1); padding:15px; border-radius:8px; border-right:3px solid #fbbf24;">
              <strong style="color:#fbbf24;">💡 توصیه:</strong> ${c.advice_full || c.advice}
            </div>
            <div style="margin-top:12px; font-size:0.9rem; color:var(--muted);"><strong>پاسخ بله/خیر:</strong> ${c.yesNo_exp || c.yesNo}</div>
          </div>
        `;
      }
    }
    
    textDiv.innerHTML = html;
    resultDiv.style.display = 'block';
    document.getElementById('share-btn').style.display = 'block';
    document.getElementById('new-fal-btn').style.display = 'block';
    
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function shareTarot() {
    let text = `🔮 فال تاروت (${currentSpread.title}):\n\n`;
    for (let i = 0; i < drawnCards.length; i++) {
      text += `${currentSpread.labels[i]}: ${drawnCards[i].name}\n`;
    }
    text += `\nفال از: ابزارک فارسی`;
    const url = window.location.href;
    
    if (navigator.share) {
      navigator.share({ title: 'فال تاروت', text: text, url: url }).catch(console.error);
    } else {
      navigator.clipboard.writeText(text + '\n' + url).then(() => alert('متن فال کپی شد!'));
    }
  }

  function resetTarot() {
    document.getElementById('tarot-start').style.display = 'block';
    document.getElementById('tarot-result').style.display = 'none';
    document.getElementById('cards-wrapper').innerHTML = '';
  }

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
