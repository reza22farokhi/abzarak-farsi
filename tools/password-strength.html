<script>
const commonPasswords = ['123456', 'password', '12345678', 'qwerty', '123456789', '12345', '1234', '111111', '1234567', 'dragon', '123123', 'baseball', 'abc123', 'football', 'monkey', 'letmein', '696969', 'shadow', 'master', '666666', 'qwertyuiop', '123321', 'mustang', '1234567890', 'michael', '654321', 'pussy', 'superman', '1qaz2wsx', '7777777', 'fuckyou', '121212', '000000', 'qazwsx', '123qwe', 'killer', 'trustno1', 'jordan', 'jennifer', 'zxcvbnm', 'asdfgh', 'hunter', 'buster', 'soccer', 'harley', 'batman', 'andrew', 'tigger', 'sunshine', 'iloveyou', 'fuckme', '2000', 'charlie', 'robert', 'thomas', 'hockey', 'ranger', 'daniel', 'starwars', 'klaster', '112233', 'george', 'asshole', 'computer', 'michelle', 'jessica', 'pepper', '1111', 'zxcvbn', '555555', '11111111', '131313', 'freedom', '777777', 'pass', 'fuck', 'maggie', '159753', 'aaaaaa', 'ginger', 'princess', 'joshua', 'cheese', 'amanda', 'summer', 'love', 'ashley', '6969', 'nicole', 'chelsea', 'biteme', 'matthew', 'access', 'yankees', '987654321', 'dallas', 'austin', 'thunder', 'taylor', 'matrix'];

function toggleVisibility() {
  const input = document.getElementById('password');
  const btn = document.getElementById('toggle-btn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

function calculateEntropy(pw) {
  let poolSize = 0;
  if (/[a-z]/.test(pw)) poolSize += 26;
  if (/[A-Z]/.test(pw)) poolSize += 26;
  if (/[0-9]/.test(pw)) poolSize += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) poolSize += 33;
  
  if (poolSize === 0) return 0;
  return pw.length * Math.log2(poolSize);
}

function formatTime(seconds) {
  if (seconds < 1) return 'فوری';
  if (seconds < 60) return Math.round(seconds) + ' ثانیه';
  if (seconds < 3600) return Math.round(seconds / 60) + ' دقیقه';
  if (seconds < 86400) return Math.round(seconds / 3600) + ' ساعت';
  if (seconds < 31536000) return Math.round(seconds / 86400) + ' روز';
  if (seconds < 31536000 * 100) return Math.round(seconds / 31536000) + ' سال';
  if (seconds < 31536000 * 1000000) return Math.round(seconds / 31536000) + ' هزار سال';
  return 'میلیون‌ها سال';
}

function checkStrength() {
  const pw = document.getElementById('password').value;
  const bar = document.getElementById('strength-bar');
  const text = document.getElementById('strength-text');
  const crackTimeEl = document.getElementById('crack-time');
  const charCountEl = document.getElementById('char-count');
  const feedbackEl = document.getElementById('feedback');

  charCountEl.textContent = pw.length;

  if (!pw) {
    bar.style.width = '0%';
    text.textContent = '';
    crackTimeEl.textContent = '-';
    feedbackEl.style.display = 'none';
    return;
  }

  let score = 0;
  let suggestions = [];

  // 1. Blacklist check
  if (commonPasswords.includes(pw.toLowerCase())) {
    bar.style.width = '10%';
    bar.style.backgroundColor = '#ef4444';
    text.textContent = 'بسیار ضعیف (رمز رایج)';
    text.style.color = '#ef4444';
    crackTimeEl.textContent = 'فوری';
    feedbackEl.className = 'feedback weak';
    feedbackEl.innerHTML = '❌ این رمز در لیست رایج‌ترین رمزهای جهان است و هکرها آن را در اولویت اول امتحان می‌کنند.';
    feedbackEl.style.display = 'block';
    return;
  }

  // 2. Entropy calculation
  const entropy = calculateEntropy(pw);
  // Assume 10 billion guesses per second
  const secondsToCrack = Math.pow(2, entropy) / 10000000000;
  
  crackTimeEl.textContent = formatTime(secondsToCrack);

  // 3. Scoring
  if (pw.length >= 8) score += 1;
  if (pw.length >= 12) score += 1;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score += 1;
  if (/[0-9]/.test(pw)) score += 1;
  if (/[^a-zA-Z0-9]/.test(pw)) score += 1;

  // 4. Suggestions
  if (pw.length < 12) suggestions.push('طول رمز را به حداقل ۱۲ کاراکتر افزایش دهید.');
  if (!/[A-Z]/.test(pw)) suggestions.push('از حروف بزرگ استفاده کنید.');
  if (!/[0-9]/.test(pw)) suggestions.push('از اعداد استفاده کنید.');
  if (!/[^a-zA-Z0-9]/.test(pw)) suggestions.push('از نمادها (!@#$%) استفاده کنید.');
  if (/(.)\1{2,}/.test(pw)) suggestions.push('از تکرار یک حرف (مثل aaa) خودداری کنید.');

  // 5. UI Update
  if (score <= 2) {
    bar.style.width = '35%'; bar.style.backgroundColor = '#ef4444';
    text.textContent = 'ضعیف'; text.style.color = '#ef4444';
    feedbackEl.className = 'feedback weak';
  } else if (score <= 4) {
    bar.style.width = '70%'; bar.style.backgroundColor = '#f59e0b';
    text.textContent = 'متوسط'; text.style.color = '#f59e0b';
    feedbackEl.className = 'feedback medium';
  } else {
    bar.style.width = '100%'; bar.style.backgroundColor = '#10b981';
    text.textContent = 'بسیار قوی'; text.style.color = '#10b981';
    feedbackEl.className = 'feedback strong';
    suggestions = [];
  }

  if (suggestions.length > 0) {
    feedbackEl.innerHTML = '💡 <strong>پیشنهاد:</strong><br>' + suggestions.map(s => '• ' + s).join('<br>');
  } else {
    feedbackEl.innerHTML = '✅ رمز عبور شما عالی است! آن را در جای امنی نگه دارید.';
  }
  feedbackEl.style.display = 'block';
}

</script>
