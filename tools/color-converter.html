<body>
<header class="site-header"><div class="container header-inner">
  <a href="../index.html" class="brand">ابزارک فارسی</a>
  <nav><a href="../index.html">ابزارها</a> · <a href="../blog/index.html">وبلاگ</a> · <a href="../about.html">درباره</a></nav>
</div></header>
<main class="container tool-page">
  <h1>مبدل رنگ (HEX / RGB)</h1>
  <p class="tool-desc">کد رنگ خود را وارد کنید تا به فرمت دیگر تبدیل شود.</p>
  <div class="tool-box">
    <div id="color-preview" style="height:100px;border-radius:8px;margin-bottom:20px;background:#6366f1;transition:background 0.3s;border:1px solid #e2e8f0;"></div>
    <div class="field"><label>کد HEX (مثلاً #6366f1)</label>
      <input type="text" id="hex" value="#6366f1" oninput="fromHex()" style="direction:ltr"></div>
    <div class="field"><label>کد RGB (مثلاً 99, 102, 241)</label>
      <input type="text" id="rgb" value="99, 102, 241" oninput="fromRgb()" style="direction:ltr"></div>
    <button class="btn" onclick="generateRandom()">🎲 رنگ تصادفی</button>
  </div>
</main>
<footer class="site-footer"><div class="container">© ابزارک فارسی</div></footer>
<noscript><div><img src="https://mc.yandex.ru/watch/114021652" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
<script>
function updatePreview(hex) { document.getElementById('color-preview').style.background = hex; }
function fromHex() {
  let h = document.getElementById('hex').value.trim();
  if (!h.startsWith('#')) h = '#' + h;
  if (/^#[0-9A-F]{6}$/i.test(h)) {
    let r = parseInt(h.substring(1,3), 16), g = parseInt(h.substring(3,5), 16), b = parseInt(h.substring(5,7), 16);
    document.getElementById('rgb').value = `${r}, ${g}, ${b}`;
    updatePreview(h);
  }
}
function fromRgb() {
  let rgb = document.getElementById('rgb').value.split(',').map(n => parseInt(n.trim()));
  if (rgb.length === 3 && rgb.every(n => !isNaN(n) && n >= 0 && n <= 255)) {
    let h = "#" + ((1 << 24) + (rgb[0] << 16) + (rgb[1] << 8) + rgb[2]).toString(16).slice(1).toUpperCase();
    document.getElementById('hex').value = h;
    updatePreview(h);
  }
}
function generateRandom() {
  let h = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
  document.getElementById('hex').value = h; fromHex();
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
