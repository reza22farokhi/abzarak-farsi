<script>
const cities = [
  { name: 'تهران 🇮🇷', tz: 'Asia/Tehran' },
  { name: 'لندن 🇬🇧', tz: 'Europe/London' },
  { name: 'نیویورک 🇺🇸', tz: 'America/New_York' },
  { name: 'لس‌آنجلس 🇺🇸', tz: 'America/Los_Angeles' },
  { name: 'توکیو 🇯🇵', tz: 'Asia/Tokyo' },
  { name: 'دبی 🇦🇪', tz: 'Asia/Dubai' },
  { name: 'استانبول 🇹🇷', tz: 'Europe/Istanbul' },
  { name: 'سیدنی 🇦🇺', tz: 'Australia/Sydney' }
];
function update() {
  const now = new Date();
  const html = cities.map(c => {
    const time = new Intl.DateTimeFormat('fa-IR', {
      timeZone: c.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).format(now);
    const date = new Intl.DateTimeFormat('fa-IR', {
      timeZone: c.tz, weekday: 'long', month: 'long', day: 'numeric'
    }).format(now);
    return '<div class="clock-card"><h3>' + c.name + '</h3><div class="time">' + time + '</div><div class="date">' + date + '</div></div>';
  }).join('');
  document.getElementById('clocks').innerHTML = html;
}
update();
setInterval(update, 1000);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("../sw.js").catch(() => {}); });
}
</script>
