<script>
  // دیتابیس فال‌ها (نمونه‌ای از غزلیات مشهور)
  const hafezData = [
    {
      title: "غزل شماره ۱",
      verses: ["الا یا ایها الساقی ادر کاسا و ناولها", "که عشق آسان نمود اول ولی افتاد مشکل‌ها", "به بوی نافه‌ای کاخر صبا زان طره بگشاید", "ز تاب جعد مشکینش چه خون افتاد در دل‌ها"],
      meaning: "در ابتدای کار سختی‌ها و موانعی وجود دارد، اما صبر و پایداری شما نتیجه خواهد داد. به زودی گشایشی در امور حاصل می‌شود و به مراد دل خود می‌رسید. ناامید نشوید."
    },
    {
      title: "غزل شماره ۲",
      verses: ["صلاح کار کجا و من خراب کجا", "ببین تفاوت ره از کجاست تا به کجا", "دلم ز صومعه بگرفت و خرقه سالوس", "کجاست دیر مغان و شراب ناب کجا"],
      meaning: "مسیر شما با مسیر عرف عام متفاوت است. به جای ظاهر و ریا، به دنبال حقیقت درونی بروید. رهایی از قید و بندهای ظاهری برای شما خیر و برکت به همراه دارد."
    },
    {
      title: "غزل شماره ۳",
      verses: ["اگر آن ترک شیرازی به دست آرد دل ما را", "به خال هندویش بخشم سمرقند و بخارا را", "بده ساقی می باقی که در مذهب ما مستی", "روا باشد اگر گویی به چشمت خواب می‌آید"],
      meaning: "خبر خوشی از جانب کسی که دوستش دارید به شما می‌رسد. در امور عاطفی و ارتباطات، شانس با شماست. بخشندگی و گذشت در این ایام برای شما نتایج مثبتی در پی خواهد داشت."
    },
    {
      title: "غزل شماره ۴",
      verses: ["دلا بسوز که سوز تو کارها بکند", "نیاز نیم شبی دفع صد بلا بکند", "عتاب یار پری‌چهره عیب نیست بگو", "که برق روز قیامت به روز ما نرسد"],
      meaning: "درد دل خود را با خدای خود بگویید. خالصانه خواستن و دعا کردن، گره‌های کور را باز می‌کند. کمی صبر کنید، گشایش بسیار نزدیک است. به قضاوت‌های دیگران اهمیت ندهید."
    },
    {
      title: "غزل شماره ۵",
      verses: ["یوسف گم گشته بازآید به کنعان غم مخور", "کلبه احزان شود روزی گلستان غم مخور", "ای دل غمدیده حالت به شود دل بد مکن", "وین سر شوریده باز آید به سامان غم مخور"],
      meaning: "این فال از جمله امیدبخش‌ترین فال‌های حافظ است. هر غم و اندوهی که دارید به زودی برطرف می‌شود. کسی یا چیزی که از دست داده‌اید به شما بازمی‌گردد. خیالتان راحت باشد."
    },
    {
      title: "غزل شماره ۶",
      verses: ["به ملازمان سلطان که رساند این دعا را", "که به شکر پادشاهی ز نظر مران گدا را", "ز رقیب دیوسیرت به خدای خود پناهم", "مگر آن شهاب ثاقب مددی دهد خدا را"],
      meaning: "چشم زخم یا دشمنی در کمین شماست. با توکل به خدا و دوری از افراد بدطینت، از خود محافظت کنید. دعای خیر برای کسی که به او امیدوارید، گره‌گشای کار شما خواهد بود."
    },
    {
      title: "غزل شماره ۷",
      verses: ["صبا به لطف بگو آن غزال رعنا را", "که سر به کوه و بیابان تو داده‌ای ما را", "چرا؟ به سرو بمانی که دامن آزاد", "چو غنچه تنگ‌دلی پیشه کن که آزادیم"],
      meaning: "خبری از مسافرت به گوش می‌رسد. در ارتباط با کسی که به او علاقه دارید، کمی صبوری کنید. احساسات خود را پنهان نگه دارید تا بهترین نتیجه را بگیرید."
    },
    {
      title: "غزل شماره ۸",
      verses: ["شراب طهور و جام جم", "به یاد بود که دوش کردم", "دلا بسوز که سوز تو کارها بکند", "نیاز نیم شبی دفع صد بلا بکند"],
      meaning: "بخت و اقبال در چند قدمی شماست. یک فرصت استثنایی به زودی پیش روی شما قرار می‌گیرد. از آن نهایت استفاده را ببرید. تصمیمات مالی جدید شما را در مسیر درستی قرار می‌دهد."
    },
    {
      title: "غزل شماره ۹",
      verses: ["دوش وقت سحر از غصه نجاتم دادند", "واندر آن ظلمت شب آب حیاتم دادند", "بی‌خبر از همه دستم به دعایی بگرفت", "گر چه در پرده نهان بود صدایم دادند"],
      meaning: "مشکلی که فکر می‌کردید حل نمی‌شود، به صورت معجزه‌آسایی برطرف خواهد شد. نیرویی از جانب غیب به یاری شما می‌آید. شکرگزار باشید و ناامیدی را کنار بگذارید."
    },
    {
      title: "غزل شماره ۱۰",
      verses: ["ای پادشه خوبان داد از غم تنهایی", "دل بی تو به جان آمد وقت است که بازآیی", "دایم گل این بستان شاداب نمی‌ماند", "دریاب ضعیفان را در وقت توانایی"],
      meaning: "احساس تنهایی نکنید، کسی که منتظرش هستید به زودی از راه می‌رسد. در موقعیتی قرار دارید که می‌توانید به دیگران کمک کنید، از این موقعیت استفاده کنید تا خیر و برکت به شما روی آورد."
    },
    {
      title: "غزل شماره ۱۱",
      verses: ["مژده ای دل که مسیحا نفسی می‌آید", "که ز انفاس خوشش بوی کسی می‌آید", "از غم هجر مکن ناله و فریاد که دوش", "زده‌ام فال و مرا آن بت کج‌کلاه آمد"],
      meaning: "نفس تازه‌ای در کار شما دمیده می‌شود. گره کور کارها باز می‌شود. سختی‌های گذشته به پایان می‌رسد و روزهای خوشی پیش رو دارید. امیدوار باشید و به خود ایمان داشته باشید."
    },
    {
      title: "غزل شماره ۱۲",
      verses: ["ساقی به نور باده برافروز جام ما", "مطرب بگو که کار جهان شد به کام ما", "ما در پیاله عکس رخ یار دیده‌ایم", "ای بی‌خبر ز لذت شرب مدام ما"],
      meaning: "به خواسته‌های دنیایی خود خواهید رسید. شادی و سرور در انتظار شماست. به دور از غم و اندوه، به خودتان و عزیزانتان خوش بگذرانید."
    },
    {
      title: "غزل شماره ۱۳",
      verses: ["حساب کار تو در دست آفرینش نیست", "که در دو عالم از این بهترت نخواهد بود", "مکن به ظاهر تقوا که در سرادق دل", "هزار بتکده از زهد ریایی‌ات پیدا"],
      meaning: "ممکن است اطرافیانتان شما را درک نکنند، اما شما در مسیر درستی هستید. به جای توجه به ظاهر، به حقیقت درون توجه کنید. آینده بهتری در انتظار شماست."
    },
    {
      title: "غزل شماره ۱۴",
      verses: ["رسید مژده که ایام غم نخواهد ماند", "چنان نماند چنین نیز هم نخواهد ماند", "به کام دل برسد هر که در طریق طلب", "به شرط آن که به مقصود خود رسد به کمال"],
      meaning: "روزهای سختی به پایان می‌رسد. با پشتکار و تلاش به هدف خود خواهید رسید. صبر و استقامت شما به زودی نتیجه می‌دهد."
    },
    {
      title: "غزل شماره ۱۵",
      verses: ["خوشا دلی که مدام از پی وصال تو زند", "مدام دل به امید وصال تو زند", "به یاد روی تو شب‌ها نخفته‌ام که مگر", "نسیم صبح بیارد به من پیام تو را"],
      meaning: "دعای شما مستجاب می‌شود. در امور عاطفی خبرهای خوبی در راه است. پیامی که منتظرش هستید به شما می‌رسد."
    }
  ];

  const cover = document.getElementById('fal-cover');
  const loading = document.getElementById('loading');
  const result = document.getElementById('result');
  const titleEl = document.getElementById('poem-title');
  const versesEl = document.getElementById('poem-verses');
  const meaningEl = document.getElementById('poem-meaning');
  let currentPoem = null;

  function startFal() {
    // مخفی کردن همه
    cover.style.display = 'none';
    result.style.display = 'none';
    loading.style.display = 'flex';

    // شبیه‌سازی زمان باز کردن دیوان (1.5 ثانیه)
    setTimeout(() => {
      loading.style.display = 'none';
      result.style.display = 'block';
      
      // انتخاب تصادفی
      const randomIndex = Math.floor(Math.random() * hafezData.length);
      currentPoem = hafezData[randomIndex];
      
      titleEl.textContent = currentPoem.title;
      
      // ساخت ابیات
      versesEl.innerHTML = '';
      currentPoem.verses.forEach(beyt => {
        versesEl.innerHTML += `<div>${beyt}</div>`;
      });
      
      meaningEl.textContent = currentPoem.meaning;
      
      // اسکرول به نتیجه
      result.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 1500);
  }

  function shareFal() {
    if (!currentPoem) return;
    
    const text = `${currentPoem.title}\n\n${currentPoem.verses.join('\n')}\n\nتعبیر: ${currentPoem.meaning}\n\nفال از: ابزارک فارسی`;
    const url = window.location.href;
    
    if (navigator.share) {
      navigator.share({
        title: 'فال حافظ',
        text: text,
        url: url
      }).catch(console.error);
    } else {
      // Fallback: کپی به کلیپ‌بورد
      navigator.clipboard.writeText(text + '\n' + url).then(() => {
        alert('متن فال کپی شد! می‌توانید آن را برای دوستانتان بفرستید.');
      });
    }
  }

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
