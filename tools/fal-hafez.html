<style>
  .fal-container { max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
  .fal-cover {
    background: linear-gradient(135deg, #1e1b4b, #312e81); /* تم سرمه‌ای و طلایی */
    border: 2px solid #fbbf24;
    border-radius: 20px;
    padding: 60px 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    transition: all 0.5s ease;

    background-size: 150px;
    opacity: 0.5;
  }
  .fal-title { font-size: 2.2rem; font-weight: 800; color: #fbbf24; margin-bottom: 10px; position: relative; z-index: 1; }
  .fal-subtitle { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 40px; position: relative; z-index: 1; }
  .fal-btn {
    background: #fbbf24; color: #1e1b4b; font-size: 1.2rem; font-weight: 800;
    padding: 16px 40px; border: none; border-radius: 50px; cursor: pointer;
    position: relative; z-index: 1; transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(251,191,36,0.4);
  }
  .fal-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(251,191,36,0.6); }
  .fal-btn:active { transform: scale(0.95); }
  
  .fal-result { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; margin-top: 30px; animation: fadeInUp 0.8s ease; text-align: right; }
  .fal-poem-title { text-align: center; font-size: 1.5rem; color: var(--accent); font-weight: 800; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); }
  .fal-verses { text-align: center; font-size: 1.15rem; line-height: 2.4; color: var(--text); margin-bottom: 30px; font-weight: 500; }
  .fal-verses div { margin-bottom: 10px; }
  .fal-interpretation { background: rgba(99,102,241,0.05); padding: 20px; border-radius: 12px; line-height: 2; color: var(--text); border-right: 4px solid var(--accent); }
  .fal-again-btn { margin-top: 30px; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
  .fal-again-btn:hover { background: var(--accent); color: white; }
  
  .loading-overlay { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
  .spinner { width: 50px; height: 50px; border: 4px solid rgba(251,191,36,0.2); border-top-color: #fbbf24; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }

  <p class="tool-desc">نیت خود را در دل بگذرانید و دکمه زیر را لمس کنید.</p>

  <div class="fal-container">

      <!-- دکمه‌های اشتراک‌گذاری و مجدد -->

        <button class="fal-again-btn" onclick="startFal()" style="flex:2; margin-top:0;">🔄 فال مجدد</button>

<script>
  // دیتابیس فال‌ها (نمونه‌ای از غزلیات مشهور)
  

  const cover = document.getElementById('fal-cover');
  const loading = document.getElementById('loading');
  const result = document.getElementById('result');
  const titleEl = document.getElementById('poem-title');
  const versesEl = document.getElementById('poem-verses');
  const meaningEl = document.getElementById('poem-meaning');
  let currentPoem = null;

  function startFal() {
    // مخفی کردن همه
    cover.style.display = 'none';
    result.style.display = 'none';
    loading.style.display = 'flex';

    // شبیه‌سازی زمان باز کردن دیوان (1.5 ثانیه)
    setTimeout(() => {
      loading.style.display = 'none';
      result.style.display = 'block';
      
      // انتخاب تصادفی
      const randomIndex = Math.floor(Math.random() * hafezData.length);
      currentPoem = hafezData[randomIndex];
      
      titleEl.textContent = currentPoem.title;
      
      // ساخت ابیات
      versesEl.innerHTML = '';
      currentPoem.verses.forEach(beyt => {
        versesEl.innerHTML += `<div>${beyt}</div>`;
      });
      
      meaningEl.textContent = currentPoem.meaning;
      
      // اسکرول به نتیجه
      result.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 1500);
  }

  function shareFal() {
    if (!currentPoem) return;
    
    const text = `${currentPoem.title}\n\n${currentPoem.verses.join('\n')}\n\nتعبیر: ${currentPoem.meaning}\n\nفال از: ابزارک فارسی`;
    const url = window.location.href;
    
    if (navigator.share) {
      navigator.share({
        title: 'فال حافظ',
        text: text,
        url: url
      }).catch(console.error);
    } else {
      // Fallback: کپی به کلیپ‌بورد
      navigator.clipboard.writeText(text + '\n' + url).then(() => {
        alert('متن فال کپی شد! می‌توانید آن را برای دوستانتان بفرستید.');
      });
    }
  }

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(()=>{}));
</script>
