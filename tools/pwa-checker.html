<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آنالیزور PWA | ابزارک</title>
<link rel="stylesheet" href="../css/style.css?v=999">
<meta name="theme-color" content="#6366f1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.json">
<link rel="canonical" href="https://reza22farokhi.github.io/abzarak-farsi/tools/pwa-checker.html">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="../index.html" class="brand">ابزارک فارسی</a></div></header>
<main class="container" style="padding:40px 20px; text-align:center;">
  <h1>آنالیزور PWA</h1>
  <p>آدرس سایت خود را وارد کنید (مثلاً: https://google.com):</p>
  <input type="text" id="url" placeholder="https://example.com" style="width:100%; max-width:400px; padding:10px; margin-bottom:15px; direction:ltr;">
  <br>
  <button onclick="analyze()" style="padding:10px 30px; background:#6366f1; color:#fff; border:none; border-radius:5px; cursor:pointer;">آنالیز</button>
  <div id="result" style="margin-top:30px;"></div>

  <div class="ad-container" style="margin: 30px auto; text-align: center; max-width: 800px; padding: 15px; background: #f8fafc; border-radius: 12px; border: 1px dashed #cbd5e1; display: block; clear: both; width: 100%;">
      <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;">تبلیغات</div>
      <div id="pos-article-display-card-123819"></div>
  </div>

</main>
<script>
async function analyze() {
  let url = document.getElementById('url').value.trim();
  
  // پاکسازی آدرس از / اضافی در ابتدا و انتها
  url = url.replace(/^\/+/, '').replace(/\/+$/, ''); 
  
  if(!url) return alert('آدرس وارد کنید');
  if(!url.startsWith('http')) url = 'https://' + url;

  let res = document.getElementById('result');
  res.innerHTML = '⏳ در حال بررسی... (ممکن است چند ثانیه طول بکشد)';
  
  let html = '<ul style="text-align:right; list-style:none; padding:0; font-size:1.1rem; line-height:2;">';
  let score = 0;

  // 1. HTTPS
  if(url.startsWith('https')) { score += 20; html += '<li>✅ HTTPS فعال است</li>'; }
  else { html += '<li>❌ HTTPS فعال نیست</li>'; }

  try {
    // 2. Manifest (بررسی مستقیم بدون واسطه)
    let r1 = await fetch(url + '/manifest.json', {signal: AbortSignal.timeout(5000)});
    if(r1.ok) { score += 40; html += '<li>✅ فایل manifest.json پیدا شد</li>'; }
    else { html += '<li>❌ فایل manifest.json پیدا نشد</li>'; }
  } catch(e) {
    html += '<li>⚠️ خطا در خواندن manifest (محدودیت مرورگر یا وجود ندارد)</li>';
  }

  try {
    // 3. Service Worker (بررسی مستقیم بدون واسطه)
    let r2 = await fetch(url + '/sw.js', {signal: AbortSignal.timeout(5000)});
    if(r2.ok) { score += 40; html += '<li>✅ فایل sw.js پیدا شد</li>'; }
    else { html += '<li>❌ فایل sw.js پیدا نشد</li>'; }
  } catch(e) {
    html += '<li>⚠️ خطا در خواندن sw.js (محدودیت مرورگر یا وجود ندارد)</li>';
  }

  html += '</ul>';
  
  if (score >= 80) {
    html += '<h3 style="color:green; margin-top:20px;">🎉 عالی! سایت شما آماده تبدیل به اپلیکیشن است.</h3>';
  } else {
    html += '<h3 style="color:red; margin-top:20px;">⚠️ سایت شما نیاز به کار دارد یا اجازه خواندن فایل‌ها را نمی‌دهد.</h3>';
  }

  res.innerHTML = html;
}
</script>
<script src="../js/theme.js"></script>
<script src="../js/app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script>
<script src="../js/animations.js"></script>
</body>
</html>
