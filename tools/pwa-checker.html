<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آنالیزور PWA | ابزارک</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="../index.html" class="brand">ابزارک فارسی</a></div></header>
<main class="container" style="padding:40px 20px; text-align:center;">
  <h1>آنالیزور PWA</h1>
  <p>آدرس سایت خود را وارد کنید:</p>
  <input type="text" id="url" placeholder="https://example.com" style="width:100%; max-width:400px; padding:10px; margin-bottom:15px;">
  <br>
  <button onclick="analyze()" style="padding:10px 30px; background:#6366f1; color:#fff; border:none; border-radius:5px; cursor:pointer;">آنالیز</button>
  <div id="result" style="margin-top:30px;"></div>
</main>
<script>
const PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?',
  'https://api.codetabs.com/v1/proxy?quest='
];
async function fetchCORS(url) {
  for (let p of PROXIES) {
    try {
      let finalUrl = p.includes('quest=') ? p + url : p + encodeURIComponent(url);
      let r = await fetch(finalUrl, {signal: AbortSignal.timeout(5000)});
      if(r.ok) return r;
    } catch(e) {}
  }
  return null;
}
async function analyze() {
  let url = document.getElementById('url').value.trim();
  if(!url) return alert('آدرس وارد کنید');
  if(!url.startsWith('http')) url = 'https://' + url;
  let base = url.replace(/\/$/, '');
  let res = document.getElementById('result');
  res.innerHTML = 'در حال بررسی...';
  
  let html = '<ul style="text-align:right; list-style:none; padding:0;">';
  let score = 0;

  // HTTPS
  if(url.startsWith('https')) { score += 20; html += '<li>✅ HTTPS فعال است</li>'; }
  else { html += '<li>❌ HTTPS فعال نیست</li>'; }

  // Manifest
  let manFound = false;
  let r1 = await fetchCORS(base + '/manifest.json');
  if(r1 && r1.ok) { manFound = true; score += 40; html += '<li>✅ فایل manifest.json پیدا شد</li>'; }
  else { html += '<li>❌ فایل manifest.json پیدا نشد</li>'; }

  // Service Worker
  let swFound = false;
  let r2 = await fetchCORS(base + '/sw.js');
  if(r2 && r2.ok) { swFound = true; score += 40; html += '<li>✅ فایل sw.js پیدا شد</li>'; }
  else { html += '<li>❌ فایل sw.js پیدا نشد</li>'; }

  html += '</ul>';
  
  if (score >= 80) {
    html += '<h3 style="color:green;">🎉 عالی! سایت شما آماده تبدیل به اپلیکیشن است.</h3>';
    html += '<a href="https://www.pwabuilder.com/" target="_blank" style="display:inline-block; margin-top:10px; padding:10px 20px; background:green; color:white; text-decoration:none; border-radius:5px;">ساخت اپلیکیشن</a>';
  } else {
    html += '<h3 style="color:red;">⚠️ سایت شما نیاز به کار دارد.</h3>';
  }

  res.innerHTML = html;
}
</script>
</body>
</html>
