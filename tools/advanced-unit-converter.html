<main class="container tool-page" style="max-width:900px;">
  <h1>مبدل واحد پیشرفته</h1>
  <p class="tool-desc">یک مقدار وارد کنید تا معادل آن در تمام واحدهای دیگر را همزمان ببینید.</p>

  <div class="adv-input-box">
    <div class="adv-grid">
      <div>
        <label>دسته‌بندی</label>
        <select id="adv-cat" onchange="updateUnits()">
          <option value="length">طول (Length)</option>
          <option value="weight">وزن (Weight)</option>
          <option value="temperature">دما (Temperature)</option>
        </select>
      </div>
      <div>
        <label>واحد ورودی</label>
        <select id="adv-from" onchange="convertAll()"></select>
      </div>
    </div>
    <div style="margin-top: 16px;">
      <label>مقدار را وارد کنید</label>
      <input type="number" id="adv-val" value="1" step="any" oninput="convertAll()">
    </div>
  </div>

  <table class="result-table" id="result-table">
    <thead>
      <tr>
        <th>واحد</th>

    </tbody>
  </table>

<script>
const data = {
  length: {
    m: { name: 'متر (m)', factor: 1 },
    cm: { name: 'سانتی‌متر (cm)', factor: 0.01 },
    km: { name: 'کیلومتر (km)', factor: 1000 },
    inch: { name: 'اینچ (inch)', factor: 0.0254 },
    foot: { name: 'فوت (foot)', factor: 0.3048 },
    mile: { name: 'مایل (mile)', factor: 1609.344 },
    yard: { name: 'یارد (yard)', factor: 0.9144 }
  },
  weight: {
    kg: { name: 'کیلوگرم (kg)', factor: 1 },
    g: { name: 'گرم (g)', factor: 0.001 },
    mg: { name: 'میلی‌گرم (mg)', factor: 0.000001 },
    pound: { name: 'پوند (pound)', factor: 0.45359237 },
    ounce: { name: 'اونس (ounce)', factor: 0.028349523125 },
    ton: { name: 'تن (ton)', factor: 1000 }
  },
  temperature: {
    C: { name: 'سلسیوس (°C)', factor: 1 },
    F: { name: 'فارنهایت (°F)', factor: 1 },
    K: { name: 'کلوین (K)', factor: 1 }
  }
};

function updateUnits() {
  const cat = document.getElementById('adv-cat').value;
  const fromSelect = document.getElementById('adv-from');
  fromSelect.innerHTML = '';
  for (let key in data[cat]) {
    let opt = document.createElement('option');
    opt.value = key;
    opt.text = data[cat][key].name;
    fromSelect.appendChild(opt);
  }
  convertAll();
}

function convertAll() {
  const cat = document.getElementById('adv-cat').value;
  const from = document.getElementById('adv-from').value;
  let val = parseFloat(document.getElementById('adv-val').value);
  if (isNaN(val)) val = 0;
  
  const tbody = document.getElementById('result-body');
  tbody.innerHTML = '';
  
  if (cat === 'temperature') {
    // محاسبه دما
    let c;
    if (from === 'C') c = val;
    else if (from === 'F') c = (val - 32) * 5 / 9;
    else c = val - 273.15;
    
    for (let key in data.temperature) {
      let res;
      if (key === 'C') res = c;
      else if (key === 'F') res = c * 9 / 5 + 32;
      else res = c + 273.15;
      
      let formatted = res.toFixed(2).replace(/\.00$/, '');
      tbody.innerHTML += `<tr><td class="unit-name">${data.temperature[key].name}</td><td class="unit-value">${formatted}</td></tr>`;
    }
  } else {
    // محاسبه طول و وزن
    let baseVal = val * data[cat][from].factor; // به واحد پایه (متر یا کیلوگرم)
    
    for (let key in data[cat]) {
      let res = baseVal / data[cat][key].factor;
      let formatted;
      
      if (Math.abs(res) < 0.001 && res !== 0) {
        formatted = res.toExponential(4);
      } else {
        formatted = res.toLocaleString('en-US', { maximumFractionDigits: 6 });
      }
      
      tbody.innerHTML += `<tr><td class="unit-name">${data[cat][key].name}</td><td class="unit-value">${formatted}</td></tr>`;
    }
  }
}

// اجرای اولیه
window.onload = updateUnits;
</script>
